# Single-node cluster with the bundled Prometheus + Grafana stack
global:
  dir.conf: "/etc/seaweed"
  dir.data: "/opt/seaweed"
  volumeSizeLimitMB: 100
  replication: "000"

master_servers:
  - ip: 172.28.0.10
    port: 9333

volume_servers:
  - ip: 172.28.0.10
    port: 8382
    folders:
      - folder: /opt/seaweed/vol1
        disk: ""

filer_servers:
  - ip: 172.28.0.10
    port: 8888

monitoring:
  host: 172.28.0.10
  bind: 0.0.0.0
  grafana_admin_password: test-grafana-pw
